apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spring-grpc-samples.fullname" . }}
  labels:
    {{ include "spring-grpc-samples.labels" . | nindent 4 }}
data:
  application.yml: |
    spring:
      profiles:
        active: {{ .Values.spring.profiles.active | quote }}
      liquibase:
        enabled: {{ .Values.spring.liquibase.enabled }}
      datasource:
        url: {{ .Values.spring.datasource.url | quote }}

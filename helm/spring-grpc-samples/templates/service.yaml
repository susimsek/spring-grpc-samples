apiVersion: v1
kind: Service
metadata:
  name: {{ include "spring-grpc-samples.fullname" . }}
  labels:
    {{ include "spring-grpc-samples.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{ include "spring-grpc-samples.selectorLabels" . | nindent 4 }}
